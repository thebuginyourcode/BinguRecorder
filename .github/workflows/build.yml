name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test AVI writer
        run: tests/run_tests.sh

  plugin:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CTRPluginFramework and 3gxtool
        run: scripts/install-ctrpf.sh
      - name: Build plugin
        run: make -C plugin
      - uses: actions/upload-artifact@v4
        with:
          name: BinguRecorder
          path: plugin/BinguRecorder.3gx
